<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspaces - AI Evidence Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0a0b0f',
                        'bg-secondary': '#111318',
                        'bg-tertiary': '#1a1d26',
                        'border': '#1e2130',
                        'accent': '#4f7cff',
                        'accent-hover': '#3a68f0',
                        'success': '#22d3a0',
                        'warning': '#f59e0b',
                        'danger': '#ef4444',
                        'text-primary': '#f1f5f9',
                        'text-secondary': '#94a3b8',
                        'text-muted': '#475569',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="antialiased selection:bg-accent/30 selection:text-white h-screen flex flex-col">

    <!-- Top Nav -->
    <nav class="glass-nav sticky top-0 z-40">
        <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-text-primary font-bold text-lg hover:opacity-80 transition-opacity">
                <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent">
                    <i data-lucide="network" class="w-5 h-5"></i>
                </div>
                Evidence<span class="text-text-secondary font-medium">Canvas</span>
            </a>
            
            <div class="flex items-center gap-4">
                <button onclick="showModal('new-workspace-modal')" class="px-4 py-2 rounded-lg bg-accent hover:bg-accent-hover text-white text-sm font-medium transition-colors shadow-lg shadow-accent/20 flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> New Workspace
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto bg-bg-primary p-6">
        <div class="max-w-[1400px] mx-auto">
            
            <!-- Header & Search -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-text-primary">My Investigations</h1>
                    <p class="text-sm text-text-secondary mt-1">Manage and access your evidence workspaces</p>
                </div>
                <div class="relative w-full md:w-80">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-text-muted"></i>
                    <input type="text" id="searchInput" placeholder="Search workspaces..." class="w-full bg-bg-secondary border border-border rounded-lg pl-9 pr-4 py-2 text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all">
                </div>
            </div>

            <!-- Stats Row -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="bg-bg-secondary border border-border rounded-xl p-4">
                    <div class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-2">Total Workspaces</div>
                    <div class="text-2xl font-bold text-text-primary" id="stat-workspaces">-</div>
                </div>
                <div class="bg-bg-secondary border border-border rounded-xl p-4">
                    <div class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-2">Total Evidence</div>
                    <div class="text-2xl font-bold text-text-primary" id="stat-evidence">-</div>
                </div>
                <div class="bg-bg-secondary border border-border rounded-xl p-4">
                    <div class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-2">Total Connections</div>
                    <div class="text-2xl font-bold text-text-primary" id="stat-connections">-</div>
                </div>
                <div class="bg-bg-secondary border border-border rounded-xl p-4">
                    <div class="text-text-muted text-xs font-semibold uppercase tracking-wider mb-2">Active</div>
                    <div class="text-2xl font-bold text-success">Online</div>
                </div>
            </div>

            <!-- Grid -->
            <div id="workspaces-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Skeletons populated by JS initially -->
            </div>
            
            <!-- Empty State (Hidden by default) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 bg-bg-secondary/30 border border-border border-dashed rounded-xl">
                <div class="w-16 h-16 rounded-full bg-bg-tertiary flex items-center justify-center mb-4 text-text-muted">
                    <i data-lucide="folder-search" class="w-8 h-8"></i>
                </div>
                <h3 class="text-lg font-semibold text-text-primary mb-2">No investigations found</h3>
                <p class="text-sm text-text-secondary mb-6 text-center max-w-md">Get started by creating your first workspace to upload evidence and discover relationships.</p>
                <button onclick="showModal('new-workspace-modal')" class="px-5 py-2.5 rounded-lg bg-accent hover:bg-accent-hover text-white text-sm font-medium transition-colors shadow-lg shadow-accent/20">
                    Create Investigation
                </button>
            </div>

        </div>
    </main>

    <!-- New Workspace Modal -->
    <div id="new-workspace-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="modal-panel bg-bg-primary border border-border rounded-xl shadow-2xl w-full max-w-md mx-4 transition-all duration-200" style="opacity:1; transform:scale(1)">
            <div class="flex items-center justify-between p-5 border-b border-border">
                <h2 class="text-lg font-semibold text-text-primary">New Investigation</h2>
                <button onclick="hideModal('new-workspace-modal')" class="text-text-muted hover:text-text-primary transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="create-workspace-form" class="p-5">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-text-secondary mb-1.5" for="name">Workspace Name <span class="text-danger">*</span></label>
                    <input type="text" id="name" required placeholder="e.g., Project Phoenix Audit" class="w-full bg-bg-secondary border border-border rounded-lg px-3 py-2 text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-text-secondary mb-1.5" for="description">Description (Optional)</label>
                    <textarea id="description" rows="3" placeholder="Brief context about this investigation..." class="w-full bg-bg-secondary border border-border rounded-lg px-3 py-2 text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-all resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="hideModal('new-workspace-modal')" class="px-4 py-2 rounded-lg text-sm font-medium text-text-secondary hover:text-text-primary hover:bg-bg-tertiary transition-colors">Cancel</button>
                    <button type="submit" id="btn-create" class="px-4 py-2 rounded-lg text-sm font-medium bg-accent hover:bg-accent-hover text-white transition-colors flex items-center gap-2">
                        Create Workspace
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Global modal functions available immediately for inline HTML onclick handlers
        window.showModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                const panel = modal.querySelector('.modal-panel');
                if (panel) {
                    requestAnimationFrame(() => {
                        panel.style.opacity = '1';
                        panel.style.transform = 'scale(1) translateY(0)';
                    });
                }
            }
        };

        window.hideModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) {
                const panel = modal.querySelector('.modal-panel');
                if (panel) {
                    panel.style.opacity = '0';
                    panel.style.transform = 'scale(0.95) translateY(10px)';
                }
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 200);
            }
        };
    </script>

    <!-- Application Logic -->
    <script type="module">
        import api from './assets/js/api.js';
        import { showToast, formatDate, getStatusBadge, debounce, confirm, setLoading } from './assets/js/utils.js';

        let allWorkspaces = [];

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadWorkspaces();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', debounce((e) => {
                const query = e.target.value.toLowerCase();
                const filtered = allWorkspaces.filter(w => 
                    w.name.toLowerCase().includes(query) || 
                    (w.description && w.description.toLowerCase().includes(query))
                );
                renderGrid(filtered);
            }, 300));

            // Create Form
            document.getElementById('create-workspace-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-create');
                const name = document.getElementById('name').value;
                const description = document.getElementById('description').value;
                
                setLoading(btn, true, 'Creating...');
                
                const { data, error } = await api.workspaces.create({ name, description });
                
                setLoading(btn, false);
                
                if (error) {
                    showToast(error, 'error');
                } else {
                    showToast('Workspace created successfully', 'success');
                    hideModal('new-workspace-modal');
                    e.target.reset();
                    // Navigate to canvas or reload
                    if(data && data.id) {
                        window.location.href = `canvas.html?workspace=${data.id}`;
                    } else {
                        loadWorkspaces();
                    }
                }
            });
        }

        async function loadWorkspaces() {
            const grid = document.getElementById('workspaces-grid');
            
            // Show skeletons
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="bg-bg-secondary border border-border rounded-xl p-5 flex flex-col h-48 skeleton"></div>
            `).join('');

            const { data, error } = await api.workspaces.list();
            
            if (error) {
                showToast(error, 'error');
                grid.innerHTML = '';
                // Since there is no actual backend yet, let's mock some data to show UI if API fails
                mockDataFallback();
                return;
            }
            
            // API returns {workspaces: [...]} — unwrap the array
            allWorkspaces = (data && data.workspaces) ? data.workspaces : [];
            updateStats(allWorkspaces);
            renderGrid(allWorkspaces);
        }

        function updateStats(workspaces) {
            document.getElementById('stat-workspaces').textContent = workspaces.length;
            
            // API uses snake_case: evidence_count, relationship_count
            let totalEv = 0;
            let totalConn = 0;
            workspaces.forEach(w => {
                totalEv += w.evidence_count || w.evidenceCount || 0;
                totalConn += w.relationship_count || w.relationshipCount || 0;
            });
            
            document.getElementById('stat-evidence').textContent = totalEv;
            document.getElementById('stat-connections').textContent = totalConn;
        }

        function renderGrid(workspaces) {
            const grid = document.getElementById('workspaces-grid');
            const emptyState = document.getElementById('empty-state');
            
            if (workspaces.length === 0) {
                grid.innerHTML = '';
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }
            
            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            
            grid.innerHTML = workspaces.map(ws => `
                <div class="bg-bg-secondary border border-border rounded-xl p-5 flex flex-col hover:border-border/80 hover:shadow-lg transition-all animate-fade-in group">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-text-primary text-lg truncate pr-4">${escapeHtml(ws.name)}</h3>
                        ${getStatusBadge(ws.status)}
                    </div>
                    
                    <p class="text-sm text-text-secondary line-clamp-2 mb-4 flex-1">
                        ${escapeHtml(ws.description || 'No description provided.')}
                    </p>
                    
                    <!-- Mini Canvas Preview Graphic -->
                    <div class="w-full h-12 mb-4 relative opacity-40 group-hover:opacity-100 transition-opacity">
                        <svg class="w-full h-full" preserveAspectRatio="none">
                            <path d="M 20 24 Q 60 10, 100 24 T 180 24" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,4"/>
                            <circle cx="20" cy="24" r="4" fill="var(--accent)"/>
                            <circle cx="100" cy="24" r="5" fill="var(--image)"/>
                            <circle cx="180" cy="24" r="4" fill="var(--pdf)"/>
                        </svg>
                    </div>
                    
                    <div class="flex items-center gap-4 text-xs text-text-muted mb-4">
                        <div class="flex items-center gap-1.5" title="Evidence count">
                            <i data-lucide="files" class="w-3.5 h-3.5"></i> ${ws.evidence_count || ws.evidenceCount || 0}
                        </div>
                        <div class="flex items-center gap-1.5" title="Relationships found">
                            <i data-lucide="git-merge" class="w-3.5 h-3.5"></i> ${ws.relationship_count || ws.relationshipCount || 0}
                        </div>
                        <div class="flex items-center gap-1.5 ml-auto text-[10px]">
                            Updated ${formatDate(ws.updated_at || ws.updatedAt || ws.created_at || ws.createdAt)}
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 pt-3 border-t border-border">
                        <a href="canvas.html?workspace=${ws.id}" class="flex-1 text-center py-2 rounded-lg bg-bg-tertiary hover:bg-accent/10 hover:text-accent text-sm font-medium transition-colors border border-border hover:border-accent/30">
                            Open Canvas
                        </a>
                        <button onclick="deleteWorkspace('${ws.id}')" class="p-2 rounded-lg bg-bg-tertiary hover:bg-danger/10 hover:text-danger text-text-muted transition-colors border border-border hover:border-danger/30" title="Delete Workspace">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        // Expose delete to window
        window.deleteWorkspace = async (id) => {
            const confirmed = await confirm('Are you sure you want to delete this investigation? This action cannot be undone and will permanently delete all evidence and relationships.', 'Delete Investigation');
            if (!confirmed) return;
            
            showToast('Deleting workspace...', 'info');
            
            // Assuming local fallback state for demo purposes if backend fails
            const originalWorkspaces = [...allWorkspaces];
            allWorkspaces = allWorkspaces.filter(w => w.id !== id);
            renderGrid(allWorkspaces);
            updateStats(allWorkspaces);
            
            const { error } = await api.workspaces.delete(id);
            if (error) {
                // mock mode fallback check
                if(error.includes('Network error')) {
                    showToast('Deleted (Mock Mode)', 'success');
                } else {
                    showToast(error, 'error');
                    allWorkspaces = originalWorkspaces;
                    renderGrid(allWorkspaces);
                    updateStats(allWorkspaces);
                }
            } else {
                showToast('Workspace deleted successfully', 'success');
            }
        };

        function escapeHtml(unsafe) {
            return (unsafe || '').replace(/[&<"']/g, function(m) {
                switch (m) {
                    case '&': return '&amp;';
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '"': return '&quot;';
                    default: return '&#039;';
                }
            });
        }
        
        // Mock fallback if API isn't running to show UI
        function mockDataFallback() {
            showToast('API unreachable. Showing demo data.', 'warning');
            allWorkspaces = [
                { id: '1', name: 'Project Titan Leak', description: 'Investigating internal document leaks regarding the Q4 product roadmap.', status: 'active', evidenceCount: 42, relationshipCount: 15, updatedAt: new Date().toISOString() },
                { id: '2', name: 'Offshore Accounts 2026', description: 'Cross-referencing leaked emails with registry documents.', status: 'processing', evidenceCount: 128, relationshipCount: 89, updatedAt: new Date(Date.now() - 3600000).toISOString() },
                { id: '3', name: 'Vendor Dispute - ACME Corp', description: 'Contract review and historical email communication timeline.', status: 'archived', evidenceCount: 15, relationshipCount: 3, updatedAt: new Date(Date.now() - 86400000 * 5).toISOString() }
            ];
            updateStats(allWorkspaces);
            renderGrid(allWorkspaces);
        }
    </script>
</body>
</html>
