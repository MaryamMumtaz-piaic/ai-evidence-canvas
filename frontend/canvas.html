<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Evidence Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0a0b0f',
            cards: '#111318',
            panels: '#1a1d26',
            panelBorder: '#1e2130',
            accent: '#4f7cff',
            textMain: '#f1f5f9',
            muted: '#475569',
            type: {
              pdf: '#ef4444',
              image: '#8b5cf6',
              url: '#06b6d4',
              note: '#f59e0b',
              email: '#22d3a0'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0b0f; color: #f1f5f9; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #canvasContainer {
      background-image: radial-gradient(#1e2130 1px, transparent 1px);
      background-size: 24px 24px;
      cursor: grab;
    }
    #canvasContainer:active { cursor: grabbing; }
    .space-pan { cursor: grab !important; }
    .space-pan:active { cursor: grabbing !important; }
    
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .panel-slide-right { transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .panel-slide-right.open { transform: translateX(0); }
    .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0b0f; }
    ::-webkit-scrollbar-thumb { background: #1e2130; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="flex flex-col h-screen w-screen">

  <!-- Top Navigation -->
  <nav id="topNav" class="h-14 border-b border-panelBorder bg-panels flex items-center justify-between px-4 z-50 shrink-0 shadow-md">
    <div class="flex items-center gap-3">
      <i data-lucide="network" class="text-accent w-6 h-6"></i>
      <h1 class="font-semibold text-lg flex items-center gap-2">
        <span class="text-muted">Workspace /</span> Project Alpha
      </h1>
    </div>
    <div class="flex-1 max-w-md mx-8 relative">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted"></i>
      <input type="text" placeholder="Search evidence, entities, content..." class="w-full bg-cards border border-panelBorder rounded-full py-1.5 pl-10 pr-4 text-sm focus:outline-none focus:border-accent text-textMain transition-colors">
    </div>
    <div class="flex items-center gap-2">
      <button id="navAskAIBtn" class="px-3 py-1.5 text-sm bg-accent hover:bg-blue-600 text-white rounded-md flex items-center gap-2 transition-colors">
        <i data-lucide="sparkles" class="w-4 h-4"></i> Ask AI
      </button>
      <div class="w-px h-6 bg-panelBorder mx-1"></div>
      <button id="navFiltersBtn" class="p-2 text-muted hover:text-textMain rounded-md hover:bg-cards transition-colors relative">
        <i data-lucide="filter" class="w-5 h-5"></i>
        <span id="filterBadge" class="absolute top-1 right-1 w-2 h-2 bg-accent rounded-full hidden"></span>
      </button>
      <button class="p-2 text-muted hover:text-textMain rounded-md hover:bg-cards transition-colors">
        <i data-lucide="download" class="w-5 h-5"></i>
      </button>
    </div>
  </nav>

  <!-- Main App Layout -->
  <div id="appLayout" class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside id="evidenceSidebar" class="w-72 border-r border-panelBorder bg-panels flex flex-col z-40 transition-all duration-300">
      <div id="sidebarHeader" class="p-4 border-b border-panelBorder flex items-center justify-between shrink-0">
        <h3 class="font-semibold">Library</h3>
        <button id="addEvidenceBtn" class="p-1.5 bg-cards hover:bg-panelBorder border border-panelBorder rounded text-muted hover:text-textMain transition-colors" title="Add Evidence">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="evidenceTypeFilter" class="flex px-2 py-2 gap-1 border-b border-panelBorder overflow-x-auto shrink-0 scrollbar-hide">
        <!-- populated by JS -->
      </div>
      <div id="evidenceList" class="flex-1 overflow-y-auto p-2 space-y-2">
        <!-- List items -->
      </div>
    </aside>

    <!-- Canvas Area -->
    <main id="canvasContainer" class="flex-1 relative overflow-hidden bg-bg">
      <svg id="connectionsLayer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-[1]"></svg>
      
      <div id="canvasWorld" class="absolute top-0 left-0 origin-top-left z-[2]">
        <!-- Cards rendered here -->
      </div>

      <div id="canvasEmptyState" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center text-muted z-10 pointer-events-none hidden">
        <i data-lucide="folder-open" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
        <p>No evidence added yet.<br>Click + in the library to start.</p>
      </div>
      
      <canvas id="minimap" class="absolute bottom-16 right-4 w-40 h-32 bg-cards border border-panelBorder rounded-lg z-20 shadow-lg cursor-pointer" width="160" height="120"></canvas>
    </main>

    <!-- Right Inspector Panel -->
    <aside id="inspectorPanel" class="w-80 border-l border-panelBorder bg-panels absolute right-0 top-0 bottom-0 z-40 panel-slide-right flex flex-col shadow-2xl">
      <!-- Dynamic content -->
    </aside>

    <!-- Right AI Panel -->
    <aside id="aiChatPanel" class="w-80 border-l border-panelBorder bg-panels absolute right-0 top-0 bottom-0 z-40 panel-slide-right flex flex-col shadow-2xl">
      <div class="p-4 border-b border-panelBorder flex justify-between items-center bg-cards">
        <h3 class="font-semibold flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-accent"></i> AI Assistant</h3>
        <button id="closeAiPanelBtn" class="text-muted hover:text-textMain"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="aiChatHistory" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      <div class="p-4 border-t border-panelBorder bg-cards">
        <div class="flex flex-wrap gap-2 mb-2" id="aiQuickPrompts"></div>
        <div class="relative">
          <textarea id="aiChatInput" rows="2" placeholder="Ask about the evidence..." class="w-full bg-bg border border-panelBorder rounded-lg py-2 px-3 pr-10 text-sm resize-none focus:outline-none focus:border-accent text-textMain"></textarea>
          <button id="aiChatSubmitBtn" class="absolute right-2 bottom-2 p-1.5 text-accent hover:bg-panels rounded-md"><i data-lucide="send" class="w-4 h-4"></i></button>
        </div>
      </div>
    </aside>
    
    <!-- Filter Panel -->
    <aside id="filterPanel" class="w-72 border-l border-panelBorder bg-panels absolute right-0 top-0 bottom-0 z-40 panel-slide-right flex flex-col shadow-2xl">
      <div class="p-4 border-b border-panelBorder flex justify-between items-center bg-cards">
        <h3 class="font-semibold">Filters</h3>
        <button id="closeFilterPanelBtn" class="text-muted hover:text-textMain"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4 flex-1 overflow-y-auto">
        <!-- Filter controls -->
      </div>
    </aside>

  </div>

  <!-- Bottom Toolbar -->
  <div id="bottomToolbar" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-cards border border-panelBorder rounded-full shadow-lg flex items-center p-1.5 gap-1 z-50 transition-transform">
    <button id="zoomOutBtn" class="p-2 text-muted hover:text-textMain hover:bg-panels rounded-full" title="Zoom Out"><i data-lucide="minus" class="w-4 h-4"></i></button>
    <span id="zoomLabel" class="text-xs font-mono w-12 text-center text-muted">100%</span>
    <button id="zoomInBtn" class="p-2 text-muted hover:text-textMain hover:bg-panels rounded-full" title="Zoom In"><i data-lucide="plus" class="w-4 h-4"></i></button>
    <div class="w-px h-5 bg-panelBorder mx-1"></div>
    <button id="fitCanvasBtn" class="p-2 text-muted hover:text-textMain hover:bg-panels rounded-full" title="Fit to Screen"><i data-lucide="maximize" class="w-4 h-4"></i></button>
    <button id="autoLayoutBtn" class="p-2 text-muted hover:text-textMain hover:bg-panels rounded-full" title="Auto Layout"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
    <div class="w-px h-5 bg-panelBorder mx-1"></div>
    <div class="flex bg-panels rounded-full p-0.5">
      <button class="view-toggle active px-3 py-1 text-xs rounded-full bg-cards shadow-sm text-textMain font-medium" data-view="canvas">Canvas</button>
      <button class="view-toggle px-3 py-1 text-xs rounded-full text-muted hover:text-textMain" data-view="timeline">Timeline</button>
      <button class="view-toggle px-3 py-1 text-xs rounded-full text-muted hover:text-textMain" data-view="graph">Graph</button>
    </div>
  </div>

  <!-- Alternative Views -->
  <div id="timelineView" class="hidden absolute top-14 bottom-0 left-0 right-0 bg-bg z-30 overflow-x-auto p-8"></div>
  <div id="graphView" class="hidden absolute top-14 bottom-0 left-0 right-0 bg-bg z-30 overflow-hidden"></div>

  <!-- Modals -->
  <div id="addEvidenceModal" class="modal-overlay fixed inset-0 bg-black/60 z-[100] flex items-center justify-center backdrop-blur-sm">
    <div class="bg-panels border border-panelBorder w-[500px] rounded-xl shadow-2xl flex flex-col overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex border-b border-panelBorder">
        <button class="flex-1 py-3 text-sm font-medium border-b-2 border-accent text-textMain" data-tab="upload">Upload File</button>
        <button class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-muted hover:text-textMain" data-tab="url">Add URL</button>
        <button class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-muted hover:text-textMain" data-tab="note">Write Note</button>
      </div>
      <div class="p-6">
        <div id="uploadTabContent" class="text-center p-8 border-2 border-dashed border-panelBorder rounded-lg hover:border-accent transition-colors cursor-pointer">
          <i data-lucide="upload-cloud" class="w-10 h-10 text-muted mx-auto mb-2"></i>
          <p class="text-sm">Drag & drop files here or click to browse</p>
          <p class="text-xs text-muted mt-1">Supports PDF, PNG, JPG, TXT, MD</p>
        </div>
        <!-- Other tabs hidden initially -->
      </div>
      <div class="p-4 border-t border-panelBorder bg-cards flex justify-end gap-2">
        <button class="px-4 py-2 text-sm text-muted hover:text-textMain closeModalBtn">Cancel</button>
        <button id="submitEvidenceBtn" class="px-4 py-2 text-sm bg-accent hover:bg-blue-600 text-white rounded-md transition-colors">Add to Workspace</button>
      </div>
    </div>
  </div>

  <!-- Source Viewer Modal -->
  <div id="sourceViewerModal" class="modal-overlay fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-8">
    <div class="bg-panels border border-panelBorder w-full max-w-5xl h-full rounded-xl shadow-2xl flex flex-col" onclick="event.stopPropagation()">
      <div class="p-3 border-b border-panelBorder flex justify-between items-center bg-cards shrink-0">
        <h3 id="sourceViewerTitle" class="font-medium flex items-center gap-2"></h3>
        <button class="closeModalBtn p-1.5 hover:bg-panelBorder rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="sourceViewerContent" class="flex-1 overflow-auto bg-bg p-6"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-20 right-6 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="assets/js/canvas.js"></script>
  <script src="assets/js/evidence-cards.js"></script>
  <script src="assets/js/relationship-lines.js"></script>
  <script src="assets/js/timeline.js"></script>
  <script src="assets/js/graph-view.js"></script>
  <script src="assets/js/ai-panel.js"></script>
  <script src="assets/js/filters.js"></script>
  <script src="assets/js/source-viewer.js"></script>
  <script src="assets/js/workspace-manager.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
